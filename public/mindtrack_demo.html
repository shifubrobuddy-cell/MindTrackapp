  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Mood Configurations (Exact match to app) ---
    const MOOD_CONFIGS = {
      ecstatic: {

        label: 'Ecstatic',

        color: '#2dd4bf',

        score: 4,
      },
      calm: {
        id: 'calm',
        label: 'Calm',
        emoji: '😌',
        color: '#818cf8',
        bgGradient: 'from-indigo-500/20 to-purple-500/10',
        score: 3,
      },
      down: {
        id: 'down',
        label: 'Down',

        color: '#fbbf24',

    // --- Built-in SVG Icon Components (Lucide exact replicas) ---
    const Icons = {
      Activity: () => (

      Sparkles: () => (

      Flame: () => (

      ),
      Droplet: () => (
        <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path>
        </svg>
      ),
      Clock: () => (
        <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      ),
      Smile: () => (

          <circle cx="12" cy="12" r="10"></circle>

      Plus: () => (

      ),
      Trash2: () => (

          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          <line x1="10" x2="10" y1="11" y2="17"></line>
          <line x1="14" x2="14" y1="11" y2="17"></line>
        </svg>
      ),
      Search: () => (
        <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      ),
      Download: () => (
        <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" x2="12" y1="15" y2="3"></line>
        </svg>
      ),
      Zap: () => (
        <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      ),
      TrendingUp: () => (
        <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
          <polyline points="16 7 22 7 22 13"></polyline>
        </svg>
      ),
      CheckCircle2: () => (
        <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
      ),
      LogOut: () => (
        <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" x2="9" y1="12" y2="12"></line>
        </svg>
      ),
      ArrowRight: () => (
        <svg className="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="5" x2="19" y1="12" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      ),
    };

    // --- Seed Sample Data Generator ---
    const generateInitialData = (userId) => {
      const logs = [];
      const today = new Date();
      const moods = ['ecstatic', 'happy', 'calm', 'ecstatic', 'happy', 'calm', 'happy', 'ecstatic', 'calm', 'happy', 'down', 'happy', 'ecstatic', 'happy'];
      const notes = [
        'Great day! Slept 8.5h and finished project prototype.',
        'Morning walk in the garden, feeling focused.',
        'Steady revision session and met hydration goal.',
        'High energy day! Solved complex coding logic.',
        'Balanced routine with 45 mins workout.',
        'Peaceful evening meditation after study.',
        'Hit 8 glasses of water milestone today!',
        'Early morning study session went great.',
        'Consistent habit streak maintained.',
        'Refreshed and energetic throughout the day.',
        'Slightly busy schedule, rested early with warm tea.',
        'Productive frontend layout coding session.',
        'Achieved 10-day consistency record!',
        'Feeling accomplished with today study routine.'
      ];

      for (let i = 0; i < 14; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        const mood = moods[i % moods.length];
        const sleep = Number((7.0 + (i % 3) * 0.5 + (i % 2) * 0.2).toFixed(1));
        const water = 7 + (i % 4);
        const study = Number((3.0 + (i % 3) * 0.5).toFixed(1));
        const exercise = (i % 2 === 0 ? 30 : 45);

        logs.push({
          id: `log_${dateStr}_${userId}`,
          userId,
          date: dateStr,
          sleepHours: sleep,
          waterGlasses: water,
          studyHours: study,
          exerciseMinutes: exercise,
          mood,
          energyLevel: MOOD_CONFIGS[mood].score * 2,
          notes: notes[i % notes.length],
          createdAt: new Date().toISOString()
        });
      }
      return logs;
    };

    // --- MAIN APP COMPONENT ---
    function MindTrackApp() {
      const [activeTab, setActiveTab] = useState('home');
      const [user, setUser] = useState({
        id: 'usr_shifa',
        username: 'shifa_sayyed',
        email: 'shifa.sayyed@college.edu',
        joinedDate: '2026-08-01',
        currentStreak: 7,
        longestStreak: 14
      });
      const [allLogs, setAllLogs] = useState([]);
      const [isLogModalOpen, setIsLogModalOpen] = useState(false);
      const [customCursor, setCustomCursor] = useState(true);

      // LocalStorage Sync
      useEffect(() => {
        const storedLogs = localStorage.getItem('mindtrack_habit_logs_v2');
        if (storedLogs) {
          try {
            const parsed = JSON.parse(storedLogs);
            setAllLogs(parsed);
          } catch(e) {
            console.error(e);
          }
        } else {
          const sample = generateInitialData(user.id);
          localStorage.setItem('mindtrack_habit_logs_v2', JSON.stringify(sample));
          setAllLogs(sample);
        }
      }, []);

      // Filtered User Scoped Logs
      const userLogs = useMemo(() => {
        return user ? allLogs.filter(l => l.userId === user.id) : [];
      }, [allLogs, user]);

      const todayStr = new Date().toISOString().split('T')[0];
      const todayLog = userLogs.find(l => l.date === todayStr);

      // Save Log Handler
      const handleSaveLog = (logData) => {
        const now = new Date().toISOString();
        const existingIdx = allLogs.findIndex(l => l.userId === user.id && (l.date === logData.date || l.id === logData.id));
        let updatedLogs = [...allLogs];

        if (existingIdx >= 0) {
          updatedLogs[existingIdx] = {
            ...updatedLogs[existingIdx],
            ...logData,
            userId: user.id
          };
        } else {
          updatedLogs.unshift({
            ...logData,
            id: logData.id || `log_${logData.date}_${Date.now()}`,
            userId: user.id,
            createdAt: now
          });
        }

        setAllLogs(updatedLogs);
        localStorage.setItem('mindtrack_habit_logs_v2', JSON.stringify(updatedLogs));
        
        try {
          confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#2dd4bf', '#818cf8', '#a855f7', '#f59e0b'],
          });
        } catch(e) {}
      };

      const handleDeleteLog = (id) => {
        const updated = allLogs.filter(l => l.id !== id);
        setAllLogs(updated);
        localStorage.setItem('mindtrack_habit_logs_v2', JSON.stringify(updated));
      };

      const handleClearLogs = () => {
        const updated = allLogs.filter(l => l.userId !== user.id);
        setAllLogs(updated);
        localStorage.setItem('mindtrack_habit_logs_v2', JSON.stringify(updated));
      };

      const handleLoadSampleLogs = () => {
        const samples = generateInitialData(user.id);
        const remaining = allLogs.filter(l => l.userId !== user.id);
        const updated = [...samples, ...remaining];
        setAllLogs(updated);
        localStorage.setItem('mindtrack_habit_logs_v2', JSON.stringify(updated));
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col selection:bg-teal-500 selection:text-slate-950">
          {/* Header / Navbar */}
          <header className="sticky top-0 z-40 w-full border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md">
            <div className="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6">
              
              {/* Brand Logo */}
              <button onClick={() => setActiveTab('home')} className="group flex items-center gap-2.5 text-left transition-transform active:scale-95">
                <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-teal-500 via-indigo-500 to-purple-600 shadow-[0_0_15px_rgba(45,212,191,0.3)] transition-all group-hover:shadow-[0_0_25px_rgba(168,85,247,0.5)]">
                  <span className="text-white"><Icons.Activity /></span>
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="bg-gradient-to-r from-teal-200 via-indigo-200 to-purple-300 bg-clip-text text-lg font-extrabold tracking-tight text-transparent">
                      MindTrack
                    </span>
                    <span className="rounded-full bg-teal-500/10 px-2 py-0.5 text-[10px] font-semibold text-teal-400 border border-teal-500/20">
                      PRO
                    </span>
                  </div>
                  <p className="text-[11px] font-medium text-slate-400">
                    Developed by <span className="text-teal-300 font-semibold">Shifa Sayyed (Roll No. 41)</span> • TY BCA
                  </p>
                </div>
              </button>

              {/* Center Nav Pills */}
              <nav className="hidden md:flex items-center gap-1 rounded-full border border-slate-800 bg-slate-900/70 p-1.5 shadow-inner">
                <button
                  onClick={() => setActiveTab('home')}
                  className={`flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-xs font-medium transition-all ${
                    activeTab === 'home'
                      ? 'bg-gradient-to-r from-teal-500 to-indigo-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <Icons.Home /> Home
                </button>
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-xs font-medium transition-all ${
                    activeTab === 'dashboard'
                      ? 'bg-gradient-to-r from-teal-500 to-indigo-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <Icons.LayoutDashboard /> Dashboard
                </button>
                <button
                  onClick={() => setActiveTab('analytics')}
                  className={`flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-xs font-medium transition-all ${
                    activeTab === 'analytics'
                      ? 'bg-gradient-to-r from-teal-500 to-indigo-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <Icons.BarChart3 /> Analytics
                </button>
                <button
                  onClick={() => setActiveTab('history')}
                  className={`flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-xs font-medium transition-all ${
                    activeTab === 'history'
                      ? 'bg-gradient-to-r from-teal-500 to-indigo-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <Icons.Calendar /> Log History
                </button>
              </nav>

              {/* Right CTA / User controls */}
              <div className="flex items-center gap-3">
                <div className="hidden sm:flex items-center gap-1.5 rounded-xl border border-amber-500/30 bg-amber-500/10 px-3 py-1 text-xs font-semibold text-amber-300">
                  <span className="text-amber-400 animate-pulse"><Icons.Flame /></span>
                  <span>{user.currentStreak} Day Streak</span>
                </div>

                <div className="flex items-center gap-2 rounded-xl border border-slate-800 bg-slate-900 px-3 py-1.5">
                  <div className="flex h-6 w-6 items-center justify-center rounded-full bg-indigo-500 text-[11px] font-bold text-white">
                    {user.username.charAt(0).toUpperCase()}
                  </div>
                  <span className="hidden sm:inline text-xs font-medium text-slate-200">
                    {user.username}
                  </span>
                </div>
              </div>
            </div>

            {/* Mobile Nav */}
            <div className="flex md:hidden overflow-x-auto border-t border-slate-800/60 bg-slate-950/90 px-3 py-2 gap-1.5">
              <button onClick={() => setActiveTab('home')} className={`flex shrink-0 items-center gap-1 rounded-lg px-3 py-1.5 text-xs font-medium ${activeTab === 'home' ? 'bg-teal-500/20 text-teal-300 border border-teal-500/30' : 'text-slate-400'}`}>
                Home
              </button>
              <button onClick={() => setActiveTab('dashboard')} className={`flex shrink-0 items-center gap-1 rounded-lg px-3 py-1.5 text-xs font-medium ${activeTab === 'dashboard' ? 'bg-teal-500/20 text-teal-300 border border-teal-500/30' : 'text-slate-400'}`}>
                Dashboard
              </button>
              <button onClick={() => setActiveTab('analytics')} className={`flex shrink-0 items-center gap-1 rounded-lg px-3 py-1.5 text-xs font-medium ${activeTab === 'analytics' ? 'bg-teal-500/20 text-teal-300 border border-teal-500/30' : 'text-slate-400'}`}>
                Analytics
              </button>
              <button onClick={() => setActiveTab('history')} className={`flex shrink-0 items-center gap-1 rounded-lg px-3 py-1.5 text-xs font-medium ${activeTab === 'history' ? 'bg-teal-500/20 text-teal-300 border border-teal-500/30' : 'text-slate-400'}`}>
                History
              </button>
            </div>
          </header>

          {/* Main Body Switcher */}
          <main className="flex-1">
            {activeTab === 'home' && (
              <LandingView 
                setActiveTab={setActiveTab} 
                recentLogs={userLogs} 
                onQuickLogSubmit={handleSaveLog} 
              />
            )}
            {activeTab === 'dashboard' && (
              <DashboardView 
                logs={userLogs} 
                user={user} 
                todayLog={todayLog} 
                onSaveLog={handleSaveLog} 
                setIsLogModalOpen={setIsLogModalOpen} 
              />
            )}
            {activeTab === 'analytics' && (
              <AnalyticsView logs={userLogs} />
            )}
            {activeTab === 'history' && (
              <HistoryView 
                logs={userLogs} 
                onDeleteLog={handleDeleteLog} 
                onClearLogs={handleClearLogs} 
                onLoadSampleLogs={handleLoadSampleLogs} 
                setActiveTab={setActiveTab} 
              />
            )}
          </main>

          {/* Log Modal */}
          {isLogModalOpen && (
            <LogHabitModal 
              todayLog={todayLog} 
              todayStr={todayStr} 
              onClose={() => setIsLogModalOpen(false)} 
              onSave={handleSaveLog} 
            />
          )}

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950 py-8 px-6 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">

            <h3 className="text-lg font-bold text-slate-100">Hydration & Sleep Directly Elevate Mood Scores</h3>
            <p className="text-xs text-slate-300 leading-relaxed max-w-3xl">
              Our analysis shows that on days where water intake reached 8+ glasses and sleep exceeded 7.5 hours, your reported mood was <b>Ecstatic or Happy 88% of the time</b>. Maintain this habit routine to prevent study burnouts!
            </p>
          </div>
        </div>
      );
    }

    // --- 4. HISTORY VIEW ---
    function HistoryView({ logs, onDeleteLog, onClearLogs, onLoadSampleLogs, setActiveTab }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedMood, setSelectedMood] = useState('all');

      const filteredLogs = logs.filter((log) => {
        const matchesSearch = log.date.includes(searchTerm) || log.notes.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesMood = selectedMood === 'all' || log.mood === selectedMood;
        return matchesSearch && matchesMood;
      });

      const exportToJson = () => {
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(logs, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute('href', dataStr);
        downloadAnchor.setAttribute('download', `mindtrack_habit_logs_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      return (
        <div className="min-h-screen bg-slate-950 px-4 py-8 sm:px-6 lg:px-8 space-y-6 max-w-7xl mx-auto">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6">
            <div>
              <div className="inline-flex items-center gap-1.5 text-xs font-bold text-teal-400 uppercase tracking-wider">
                <Icons.Calendar /> Activity Journal
              </div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-100">Habit Log History</h1>
              <p className="text-xs text-slate-400 mt-1">Total entries recorded: <span className="font-bold text-teal-300">{logs.length}</span></p>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              {logs.length > 0 && (
                <button
                  onClick={() => {
                    if (confirm('Are you sure you want to clear all habit logs and start completely fresh?')) {
                      onClearLogs();
                    }
                  }}
                  className="flex items-center gap-1.5 rounded-xl border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-xs font-bold text-rose-300 hover:bg-rose-500/20 transition-all"
                >
                  <Icons.Trash2 /> Clear All Data
                </button>
              )}

              {logs.length === 0 && (
                <button
                  onClick={onLoadSampleLogs}
                  className="flex items-center gap-1.5 rounded-xl border border-indigo-500/30 bg-indigo-500/10 px-3 py-2 text-xs font-bold text-indigo-300 hover:bg-indigo-500/20 transition-all"
                >
                  <Icons.Activity /> Load Sample Data
                </button>
              )}

              {logs.length > 0 && (
                <button
                  onClick={exportToJson}
                  className="flex items-center gap-2 rounded-xl border border-teal-500/30 bg-teal-500/10 px-4 py-2 text-xs font-bold text-teal-300 hover:bg-teal-500/20 transition-all"
                >
                  <Icons.Download /> Export JSON
                </button>
              )}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="relative md:col-span-2">
              <input
                type="text"
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                placeholder="Search notes or date (YYYY-MM-DD)..."
                className="w-full rounded-xl border border-slate-800 bg-slate-900 py-2.5 px-4 text-xs text-slate-100 placeholder-slate-500 focus:border-teal-500 focus:outline-none"
              />
            </div>

            <select
              value={selectedMood}
              onChange={(e) => setSelectedMood(e.target.value)}
              className="rounded-xl border border-slate-800 bg-slate-900 py-2.5 px-3 text-xs text-slate-300 focus:border-teal-500 focus:outline-none"
            >
              <option value="all">All Mood Types</option>
              {Object.keys(MOOD_CONFIGS).map((mKey) => (
                <option key={mKey} value={mKey}>{MOOD_CONFIGS[mKey].emoji} {MOOD_CONFIGS[mKey].label}</option>
              ))}
            </select>
          </div>

          <div className="overflow-x-auto rounded-2xl border border-slate-800 bg-slate-900/80 shadow-xl">
            <table className="w-full text-left text-xs text-slate-300">
              <thead className="border-b border-slate-800 bg-slate-950/60 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                <tr>
                  <th className="px-4 py-3.5">Date</th>
                  <th className="px-4 py-3.5">Sleep</th>
                  <th className="px-4 py-3.5">Water</th>
                  <th className="px-4 py-3.5">Study</th>
                  <th className="px-4 py-3.5">Workout</th>
                  <th className="px-4 py-3.5">Mood</th>
                  <th className="px-4 py-3.5">Notes</th>
                  <th className="px-4 py-3.5 text-right">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800/60">
                {filteredLogs.length === 0 ? (
                  <tr>
                    <td colSpan={8} className="px-4 py-12 text-center text-slate-400">
                      No logs found. Click 'Dashboard' to record today's habit log.
                    </td>
                  </tr>
                ) : (
                  filteredLogs.map((log) => (
                    <tr key={log.id} className="hover:bg-slate-800/40 transition-colors">
                      <td className="px-4 py-3.5 font-bold text-slate-200">{log.date}</td>
                      <td className="px-4 py-3.5 text-indigo-300 font-semibold">{log.sleepHours}h</td>
                      <td className="px-4 py-3.5 text-sky-300 font-semibold">{log.waterGlasses} gls</td>
                      <td className="px-4 py-3.5 text-teal-300 font-semibold">{log.studyHours}h</td>
                      <td className="px-4 py-3.5 text-purple-300 font-semibold">{log.exerciseMinutes}m</td>
                      <td className="px-4 py-3.5">
                        <span className="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-semibold border border-slate-800 bg-slate-950">
                          <span>{MOOD_CONFIGS[log.mood]?.emoji}</span>
                          <span className="capitalize">{log.mood}</span>
                        </span>
                      </td>
                      <td className="px-4 py-3.5 max-w-xs truncate text-slate-400">{log.notes || '-'}</td>
                      <td className="px-4 py-3.5 text-right">
                        <button
                          onClick={() => onDeleteLog(log.id)}
                          className="p-1.5 rounded-lg border border-slate-800 text-slate-400 hover:border-rose-500/40 hover:bg-rose-500/10 hover:text-rose-400 transition-all"
                        >
                          <Icons.Trash2 />
                        </button>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- 5. LOG HABIT MODAL ---
    function LogHabitModal({ todayLog, todayStr, onClose, onSave }) {
      const [sleepHours, setSleepHours] = useState(todayLog?.sleepHours ?? 8);
      const [waterGlasses, setWaterGlasses] = useState(todayLog?.waterGlasses ?? 8);
      const [studyHours, setStudyHours] = useState(todayLog?.studyHours ?? 4);
      const [exerciseMinutes, setExerciseMinutes] = useState(todayLog?.exerciseMinutes ?? 30);
      const [mood, setMood] = useState(todayLog?.mood ?? 'ecstatic');
      const [notes, setNotes] = useState(todayLog?.notes ?? '');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          id: todayLog?.id,
          date: todayStr,
          sleepHours,
          waterGlasses,
          studyHours,
          exerciseMinutes,
          mood,
          energyLevel: MOOD_CONFIGS[mood].score * 2,
          notes
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4 backdrop-blur-md">
          <div className="w-full max-w-lg rounded-3xl border border-slate-800 bg-slate-900 p-6 shadow-2xl space-y-5">
            <div className="flex items-center justify-between border-b border-slate-800 pb-4">
              <div className="flex items-center gap-2">
                <span className="text-teal-400"><Icons.Sparkles /></span>
                <h3 className="text-lg font-bold text-slate-100">Log Habits for {todayStr}</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-200 text-lg font-bold px-2">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div className="space-y-1">
                <label className="flex justify-between font-semibold text-slate-300">
                  <span>Sleep Hours</span>
                  <span className="text-indigo-400">{sleepHours} hrs</span>
                </label>
                <input type="range" min="0" max="14" step="0.5" value={sleepHours} onChange={(e) => setSleepHours(parseFloat(e.target.value))} className="w-full accent-indigo-500 cursor-pointer" />
              </div>

              <div className="space-y-1">
                <label className="flex justify-between font-semibold text-slate-300">
                  <span>Water Glasses</span>
                  <span className="text-sky-400">{waterGlasses} glasses ({waterGlasses * 250}ml)</span>
                </label>
                <input type="range" min="0" max="20" value={waterGlasses} onChange={(e) => setWaterGlasses(parseInt(e.target.value))} className="w-full accent-sky-500 cursor-pointer" />
              </div>

              <div className="space-y-1">
                <label className="flex justify-between font-semibold text-slate-300">
                  <span>Study / Revision Hours</span>
                  <span className="text-teal-400">{studyHours} hrs</span>
                </label>
                <input type="range" min="0" max="16" step="0.5" value={studyHours} onChange={(e) => setStudyHours(parseFloat(e.target.value))} className="w-full accent-teal-500 cursor-pointer" />
              </div>

              <div className="space-y-1">
                <label className="flex justify-between font-semibold text-slate-300">
                  <span>Exercise / Workout</span>
                  <span className="text-purple-400">{exerciseMinutes} mins</span>
                </label>
                <input type="range" min="0" max="180" step="5" value={exerciseMinutes} onChange={(e) => setExerciseMinutes(parseInt(e.target.value))} className="w-full accent-purple-500 cursor-pointer" />
              </div>

              <div className="space-y-1.5">
                <label className="font-semibold text-slate-300">Select Mood</label>
                <div className="grid grid-cols-5 gap-2">
                  {Object.keys(MOOD_CONFIGS).map((mKey) => (
                    <button
                      key={mKey}
                      type="button"
                      onClick={() => setMood(mKey)}
                      className={`flex flex-col items-center justify-center rounded-xl p-2.5 border transition-all ${
                        mood === mKey ? 'border-teal-500 bg-teal-500/20 text-teal-200' : 'border-slate-800 bg-slate-950 text-slate-400 hover:border-slate-700'
                      }`}
                    >
                      <span className="text-2xl">{MOOD_CONFIGS[mKey].emoji}</span>
                      <span className="text-[10px] font-semibold mt-1 capitalize">{mKey}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="space-y-1">
                <label className="font-semibold text-slate-300">Notes / Reflection</label>
                <textarea
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="What went well today? Any key insights..."
                  rows={2}
                  className="w-full rounded-xl border border-slate-800 bg-slate-950 p-2.5 text-xs text-slate-100 focus:outline-none focus:border-teal-500"
                />
              </div>

              <div className="pt-2 flex justify-end gap-3">
                <button type="button" onClick={onClose} className="rounded-xl border border-slate-800 bg-slate-950 px-4 py-2 font-semibold text-slate-400 hover:text-slate-200">
                  Cancel
                </button>
                <button type="submit" className="rounded-xl bg-gradient-to-r from-teal-500 to-indigo-600 px-5 py-2 font-bold text-white shadow-lg hover:shadow-teal-500/20">
                  Save Habit Log
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MindTrackApp />);
  </script>
</body>
</html>
